[package]
name = "martin-on-cf-workers"
version = "0.1.0"
edition = "2021"
authors = ["Hiroaki Yutani <yutani.ini@gmail.com>"]
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
http = "1"
martin-core = { version = "0.11.2", git = "https://github.com/yutannihilation/martin.git", branch = "martin-on-cf-workers", default-features = false, features = ["pmtiles"] }
martin-tile-utils = { version = "0.7.8", git = "https://github.com/yutannihilation/martin.git", branch = "martin-on-cf-workers" }
object_store = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-service = "0.3"
url = "2"
worker = { version = "0.8", features = ["http", "axum", "experimental_tokio"] }
worker-macros = { version = "0.8", features = ["http", "experimental_tokio"] }

[patch.crates-io]
mio = { git = "https://github.com/guybedford/mio", tag = "1.2.3-cf.emscripten" }
tokio = { git = "https://github.com/guybedford/tokio", tag = "1.53.1-cf.emscripten" }
wasm-streams = { git = "https://github.com/yutannihilation/wasm-streams.git", branch = "martin-on-cf-workers" }
